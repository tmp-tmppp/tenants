# Local dependencies of the tenants service: PostgreSQL 18 and NATS with JetStream.
#   docker compose up -d
#   npm run build
#   APP_ENV=local DATABASE_URL=postgres://tenants:tenants@localhost:5432/tenants NATS_URL=nats://localhost:4222 npm start
# The identity provider is not part of this file: without KEYCLOAK_URL, APP_ENV=local uses a fake one.
# Nor is markets: without MARKETS_BASE_URL (and KEYCLOAK_URL), APP_ENV=local answers every share join with 503.
# The password below is a local development value only; real ones live in the Secret tenants-env.
name: chance-tenants

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tenants
      POSTGRES_USER: tenants
      POSTGRES_PASSWORD: tenants # hooks:allow local development only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenants -d tenants"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.2-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:
