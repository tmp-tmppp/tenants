# Prod overrides. The pipeline sets the image tag; secrets come from the Secret tenants-env (TENANTS_ENV).
replicaCount: 1

env:
  APP_ENV: production
  LOG_LEVEL: info
  # The issuer is the identity provider's public address as the browser sees it (https://<public host>/realms/chance),
  # filled by the deploy pipeline from the organization variable PUBLIC_HOST (the repo's ci-cd.yml host-values); leave it
  # empty here. A deploy without it stops at start with "AUTH_ISSUER is required" instead of rejecting every token
  # (another "iss" is a 401).
  AUTH_ISSUER: ""

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
